databases:
  - name: corretora-db
    plan: free
    databaseName: corretora
    user: corretora

services:
  - type: web
    name: corretora-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: corretora-db
          property: connectionString
